name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o project.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - name: Install buildozer
        run: pip install --upgrade pip setuptools buildozer
      - name: Let p4a choose its own Kivy version
        run: sed -i 's/kivy==2.3.0/kivy/' buildozer.spec
      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Show errors on failure
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log | grep -v -E '^# +[A-Za-z_0-9]+ = ' > clean.log
          {
            echo '### Error lines'; echo '```'
            grep -n -i -E 'error|failed|exception|not found|no such file|fatal' clean.log | tail -n 30 | cut -c1-250
            echo '```'; echo '### Last 50 lines before the env dump'; echo '```'
            tail -n 50 clean.log | cut -c1-250
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discp2p-apk
          path: |
            bin/*.apk
            build.log
